version: '3.8'

services:
  job-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telegram-job-bot
    restart: unless-stopped
    ports:
      - "${WEBHOOK_PORT:-8080}:8080"
    volumes:
      - ./sessions:/app/sessions
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    environment:
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
      - TELEGRAM_PHONE=${TELEGRAM_PHONE}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - AI_PROVIDER=${AI_PROVIDER:-openai}
      - WEBHOOK_HOST=0.0.0.0
      - WEBHOOK_PORT=8080
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - TARGET_GROUP_ID=${TARGET_GROUP_ID}
      - TARGET_CHANNEL_ID=${TARGET_CHANNEL_ID:-}
      - CHECK_INTERVAL_MINUTES=${CHECK_INTERVAL_MINUTES:-60}
      - MAX_POSTS_PER_HOUR=${MAX_POSTS_PER_HOUR:-24}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - job-bot-network

  # Optional: Redis for caching (can be enabled if needed)
  # redis:
  #   image: redis:7-alpine
  #   container_name: job-bot-redis
  #   restart: unless-stopped
  #   volumes:
  #     - redis-data:/data
  #   networks:
  #     - job-bot-network

networks:
  job-bot-network:
    driver: bridge

