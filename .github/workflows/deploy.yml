name: Deploy
on:
  workflow_dispatch:
    inputs:
      client_slug:
        description: 'Client slug to deploy'
        required: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build client site
        run: pnpm --filter ./clients/${{ inputs.client_slug }}/site build
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          pnpm dlx vercel --cwd clients/${{ inputs.client_slug }}/site \
            --prod --token "$VERCEL_TOKEN" --yes
      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository }}/brand-${{ inputs.client_slug }}:${{ github.sha }} \
            clients/${{ inputs.client_slug }}/site
