name: Daily Digest

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Collect daily stats
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const [issues, pulls] = await Promise.all([
              github.paginate(github.rest.issues.listForRepo, {
                owner,
                repo,
                state: 'open',
                per_page: 100
              }),
              github.paginate(github.rest.pulls.list, {
                owner,
                repo,
                state: 'open',
                per_page: 100
              })
            ]);

            const openIssues = issues.filter(i => !i.pull_request).length;
            const openPRs = pulls.length;

            core.info(`Daily digest for ${owner}/${repo}`);
            core.info(`Open issues: ${openIssues}`);
            core.info(`Open PRs: ${openPRs}`);

            await core.summary
              .addHeading('Daily Digest')
              .addRaw(`Open issues: ${openIssues}\n`)
              .addRaw(`Open pull requests: ${openPRs}\n`)
              .write();
